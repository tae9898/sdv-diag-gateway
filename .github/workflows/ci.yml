name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev libgmock-dev
      - run: cmake -B build -S . -DCMAKE_DISABLE_FIND_PACKAGE_vsomeip3=TRUE
      - run: cmake --build build -j$(nproc)
      - run: ctest --test-dir build --output-on-failure

  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ git libgtest-dev libboost-system-dev libboost-filesystem-dev libboost-thread-dev
      - name: Build vsomeip3
        run: |
          git clone --depth 1 https://github.com/COVESA/vsomeip.git
          cmake -B vbuild -S vsomeip -DCMAKE_BUILD_TYPE=Release
          cmake --build vbuild -j$(nproc)
          sudo cmake --install vbuild
          sudo ldconfig
      - run: cmake -B build -S .
      - run: cmake --build build -j$(nproc)
